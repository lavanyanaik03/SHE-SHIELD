<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <meta name="theme-color" content="#3B2F2A">

    <title>SHE-SHIELD | Your Safety, Our Priority</title>

    <link rel="stylesheet" href="style.css">
</head>

<body>

<!-- ================= SPLASH SCREEN ================= -->

<div id="splashScreen" class="splash-screen">

    <img
        src="she-shield-logo.png.jpeg"
        alt="SHE-SHIELD Logo"
        class="splash-logo"
    >

    <h1>SHE-SHIELD</h1>

    <div class="gold-line"></div>

    <p data-i18n="tagline">
        Your Safety, Our Priority.
    </p>

</div>


<!-- ================= MAIN APP ================= -->

<div id="app" class="app hidden">

    <!-- HEADER -->

    <header class="header">

        <button class="brand" onclick="showPage('home')">

            <img
                src="she-shield-logo.png.jpeg"
                alt="SHE-SHIELD"
            >

            <div>
                <strong>SHE-SHIELD</strong>
                <small data-i18n="platform">
                    Safety & Support Platform
                </small>
            </div>

        </button>


        <div class="header-right">

            <!-- LANGUAGE -->

            <div class="language-box">

                🌐

                <select id="languageSelect">

                    <option value="en">English</option>

                    <option value="kn">ಕನ್ನಡ</option>

                    <option value="te">తెలుగు</option>

                    <option value="ta">தமிழ்</option>

                    <option value="hi">हिन्दी</option>

                </select>

            </div>

            <button
                class="menu-button"
                onclick="showPage('home')"
            >
                ☰
            </button>

        </div>

    </header>


    <!-- MAIN CONTENT -->

    <main id="mainContent"></main>


    <!-- TOAST -->

    <div id="toast"></div>


    <!-- BOTTOM NAVIGATION -->

    <nav class="bottom-nav">

        <button onclick="showPage('home')">
            🏠
            <span data-i18n="home">Home</span>
        </button>

        <button onclick="showPage('safety')">
            🛡️
            <span data-i18n="immediateSafety">
                Immediate Safety
            </span>
        </button>

        <button onclick="showPage('assessment')">
            🧠
            <span data-i18n="assessment">
                AI Assessment
            </span>
        </button>

        <button onclick="showPage('contacts')">
            👥
            <span data-i18n="contacts">
                Contacts
            </span>
        </button>

    </nav>

</div>


<script src="script.js"></script>

</body>
</html>
